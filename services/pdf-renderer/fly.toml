# Fly.io yapılandırması — PDF servisi. Frankfurt (fra), Supabase ile aynı bölge → düşük gecikme.
# Platforma özel TEK dosya budur; Dockerfile düz kalır. Taşımada yalnızca bu değişir.
app = "tekstil-pdf-renderer"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4046"
  PDF_CORS_ORIGIN = "https://crm.tekstilas.com"   # CRM yayın adresi (cPanel, 31 Ağu 2026)

[http_service]
  internal_port = 4046
  force_https = true
  # DEĞİŞİKLİK (31 Ağu 2026): önceden always-on'du (min_machines_running = 1) ve
  # servis bir noktada kapandı — sürekli açık 1 GB makine ücretlidir. Belge üretimi
  # günde birkaç kez kullanılıyor; sürekli açık tutmak maliyeti boşa harcıyordu.
  #
  # Artık askıya alınıyor: makine RAM'i diskte tutulup durduruluyor, ilk istekte
  # ~1 sn'de geri dönüyor (tam soğuk başlatma değil — Chromium yeniden kurulmuyor).
  # Belge üretimi zaten 2 sn hedefliyor; 1 sn ek gecikme kabul edilebilir, servisin
  # maliyet yüzünden tamamen kapanmasından iyidir.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "25s"
    method = "GET"
    path = "/health"

# Chromium için bellek. Ölçüm (yerel, sıcak tek sayfa): RSS ~350-450 MB.
# 512 MB tek üretimde yeter ama eşzamanlı isteklerde/uzun ömürde dar; 1 GB güvenli marj.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
